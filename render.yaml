services:
  - type: web
    name: daythread-api
    runtime: node
    plan: 0.5c-512mb
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: daythread-db
          property: connectionString
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      - key: DAYTHREAD_TRIAL_MODE
        value: 'true'
      - key: PUBLIC_BASE_URL
        sync: false
      - key: DAYTHREAD_APP_TOKEN
        sync: false
      - key: ALLOWED_RECIPIENTS
        sync: false

databases:
  - name: daythread-db
    databaseName: daythread
    user: daythread
    plan: 0.1c-256mb
    ipAllowList: []
